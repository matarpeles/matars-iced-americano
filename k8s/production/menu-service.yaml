apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: production
  labels:
    app: menu-service
    team: product-team
    tier: critical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      containers:
      - name: menu-service
        image: matars-iced-americano/menu-service:v4.1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: production
spec:
  selector:
    app: menu-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
